# Builds the Windows app as ONE exe (the .NET core is embedded in it, no installer). Addons never build here.
# Run it by hand (Actions > app > Run workflow) or push a tag app-v<version> to also get a draft release with the exe.
name: app

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: tests (core) + frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # the git service tests make commits and tags in temp repos
      - name: git identity
        run: |
          git config --global user.name "Addon Studio CI"
          git config --global user.email "ci@addonstudio.invalid"
          git config --global init.defaultBranch main

      - name: dotnet test
        run: dotnet test core/AddonStudio.slnx -c Release

      - name: npm ci
        working-directory: app
        run: npm ci

      - name: npm test
        working-directory: app
        run: npm test

      - name: npm run build
        working-directory: app
        run: npm run build

  windows:
    name: Windows app (single exe)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      # build.rs embeds this into the app exe
      - name: build the core (win-x64)
        shell: pwsh
        run: ./scripts/build-sidecar.ps1 -Rid win-x64

      - name: npm ci
        working-directory: app
        run: npm ci

      - name: tauri build (exe only, no installer)
        working-directory: app
        run: npm run tauri build -- --no-bundle

      - name: copy the exe out
        shell: pwsh
        run: ./scripts/package-exe.ps1

      # archive: false uploads the exe itself, not a zip around it
      - name: upload AddonStudio.exe
        uses: actions/upload-artifact@v7
        with:
          path: dist/AddonStudio.exe
          archive: false
          if-no-files-found: error

      # unpacks the embedded core on real Windows, starts it with no console window and checks it answers
      - name: embedded core test
        working-directory: app/src-tauri
        run: cargo test --lib

      - name: app version
        id: version
        if: startsWith(github.ref, 'refs/tags/app-v')
        shell: pwsh
        run: '"version=$((Get-Content app/package.json -Raw | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT'

      # AddonStudio.exe keeps the README's releases/latest/download/AddonStudio.exe link working for every version;
      # the versioned copy is for people who keep more than one
      - name: draft release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: Addon Studio ${{ steps.version.outputs.version }}
          files: |
            dist/AddonStudio.exe
            dist/AddonStudio-*-win-x64.exe
