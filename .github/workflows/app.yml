# Builds the Addon Studio Windows installer (NSIS). Addons themselves never build here, only the app.
# Run it by hand (Actions > app > Run workflow) or push a tag app-v<version> to also get a draft release.
name: app

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: tests (core) + frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # the git service tests make commits and tags in temp repos
      - name: git identity
        run: |
          git config --global user.name "Addon Studio CI"
          git config --global user.email "ci@addonstudio.invalid"
          git config --global init.defaultBranch main

      - name: dotnet test
        run: dotnet test core/AddonStudio.slnx -c Release

      - name: npm ci
        working-directory: app
        run: npm ci

      - name: npm test
        working-directory: app
        run: npm test

      - name: npm run build
        working-directory: app
        run: npm run build

  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: build the core sidecar (win-x64)
        shell: pwsh
        run: ./scripts/build-sidecar.ps1 -Rid win-x64

      - name: npm ci
        working-directory: app
        run: npm ci

      - name: tauri build
        working-directory: app
        run: npm run tauri build

      - name: upload installer
        uses: actions/upload-artifact@v4
        with:
          name: addon-studio-windows-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: draft release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Addon Studio ${{ github.ref_name }}
          files: app/src-tauri/target/release/bundle/nsis/*.exe
